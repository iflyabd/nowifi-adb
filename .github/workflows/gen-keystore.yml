name: One-time keystore generator

# Single-use helper: mints the stable release-signing keystore, then DELETE this
# file. Passwords below are public by design — secrecy lives in the keystore
# FILE, which is downloaded once and stored as an Actions secret.
on: workflow_dispatch

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate release keystore
        run: |
          keytool -genkeypair -keystore /tmp/release.keystore \
            -alias release -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass nowifiadb-release -keypass nowifiadb-release \
            -dname "CN=NoWiFiADB, OU=iflyabd"

      - uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: /tmp/release.keystore
